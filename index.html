<!DOCTYPE html>
<!--
  Folder layout:

  index.html
  style.css
  script.js
  fonts/SpaceMono-Regular.ttf     <- download from Google Fonts
  covers/cow.png ...              <- your album covers (square images work best)
-->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nick Jasper</title>
    <meta name="description"
        content="Official website of Nick Jasper: musician, author, indie game developer, CEO of Lebbex, and creator of Arrel.">
    <meta property="og:title" content="Nick Jasper">
    <meta property="og:description" content="Official website of Nick Jasper.">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="svg.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>

<body>
    <!-- Cursor filter (used by .cursor in style.css):
         greyscale -> threshold at 50% -> grow the bright pixels by 1px in every direction -> invert.
         So a lone white pixel on black becomes a 3x3 black square on white inside the ring. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <filter id="cursor-filter" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0
                        0.2126 0.7152 0.0722 0 0
                        0.2126 0.7152 0.0722 0 0
                        0      0      0      1 0" />
            <feComponentTransfer>
                <feFuncR type="discrete" tableValues="0 1" />
                <feFuncG type="discrete" tableValues="0 1" />
                <feFuncB type="discrete" tableValues="0 1" />
            </feComponentTransfer>
            <feMorphology operator="dilate" radius="1" />
            <feComponentTransfer>
                <feFuncR type="table" tableValues="1 0" />
                <feFuncG type="table" tableValues="1 0" />
                <feFuncB type="table" tableValues="1 0" />
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="cursor" id="cursor" aria-hidden="true"></div>

    <header class="hero">
        <h1 class="title" aria-label="NICK JASPER">
            <span class="nick" aria-hidden="true">NICK</span>
            <span class="name" aria-hidden="true">
                <span class="line">JAS</span>
                <span class="line">PER</span>
            </span>
        </h1>
    </header>

    <main>
        <section class="discography" aria-label="Discography">
            <div class="side-probe" id="side-probe" aria-hidden="true"></div>

            <div class="categories" id="categories">
                <!-- Copy/paste one <a class="album"> per album. Change href, img src and title.
                     Copy a whole <section class="category"> to add a category. -->
                <section class="category" aria-labelledby="cat-personal">
                    <h2 class="cat-title" id="cat-personal">SELF RELEASE</h2>
                    <div class="carousel" data-carousel>
                        <button class="arrow arrow-prev" type="button" data-dir="-1" aria-label="Scroll left"
                            disabled>&lt;</button>
                        <div class="scroller">
                            <div class="track">
                                <a class="album" data-fade="card" id="album-the"
                                    href="https://youtube.com/watch?v=95Vt00onysI&list=PLJrzrdM2WSXKXzhorP7A3yFC8lXLPzHgE"
                                    target="_blank" rel="noopener">
                                    <div class="cover"><img src="covers/the64.png" data-full="covers/the.png" alt=""
                                            draggable="false"></div>
                                    <p class="album-title">The cow that jumped over the moon and killed the rat</p>
                                </a>

                                <a class="album" data-fade="card" id="album-interlude"
                                    href="https://youtube.com/watch?v=jyHPsgV9p6w&list=PLJrzrdM2WSXJ7EXILNpxLMrXTTR95toSh"
                                    target="_blank" rel="noopener">
                                    <div class="cover"><img src="covers/interlude64.png"
                                            data-full="covers/interlude.png" alt="" draggable="false"></div>
                                    <p class="album-title">.&nbsp;&nbsp;I И T E R L U D E&nbsp;&nbsp;.</p>
                                </a>
                            </div>
                        </div>
                        <button class="arrow arrow-next" type="button" data-dir="1" aria-label="Scroll right"
                            disabled>&gt;</button>
                    </div>
                </section>

                <section class="category" aria-labelledby="cat-arrel">
                    <h2 class="cat-title" id="cat-arrel">ARREL™ OST</h2>
                    <div class="carousel" data-carousel>
                        <button class="arrow arrow-prev" type="button" data-dir="-1" aria-label="Scroll left"
                            disabled>&lt;</button>
                        <div class="scroller">
                            <div class="track">
                                <a class="album" data-fade="card" id="album-indev"
                                    href="https://youtube.com/watch?v=JaP1nz73gEE&list=PLEWeFT0ctV_Y" target="_blank"
                                    rel="noopener">
                                    <div class="cover"><img src="covers/indev64.png" data-full="covers/indev.png" alt=""
                                            draggable="false"></div>
                                    <p class="album-title">Volume Indev</p>
                                </a>
                            </div>
                        </div>
                        <button class="arrow arrow-next" type="button" data-dir="1" aria-label="Scroll right"
                            disabled>&gt;</button>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <footer class="links">
        <p>©2026-NICK-JASPER</p>
        <a class="link" data-fade="link" href="https://youtube.com/@NickJasper" target="_blank"
            rel="noopener">YOUTUBE</a>
        <a class="link" data-fade="link" href="https://x.com/NickJasperr" target="_blank" rel="noopener">X</a>
        <a class="link" data-fade="link" href="https://github.com/nickjasperr" target="_blank" rel="noopener">GITHUB</a>
        <a class="link" data-fade="link" href="https://instagram.com/nickjasperr" target="_blank"
            rel="noopener">INSTA</a>
        <a class="link" data-fade="link" href="https://bsky.app/profile/nickjasper.bsky.social" target="_blank"
            rel="noopener">BSKY</a>
        <a class="link" data-fade="link" href="https://lebbex.com" target="_blank" rel="noopener">LEBBEX™</a>
    </footer>

    <div class="page-overlay" id="page-overlay" aria-hidden="true" data-lenis-prevent>
        <!-- TEMP test content (the album cover, fitted to the window). script.js fills this in.
             Later: fetch the real page html into here instead. -->
        <div class="page-content" id="page-content"></div>
    </div>

    <!-- Menu popup: fades in on top of the page popup when the menu button is pressed.
         The options do nothing yet except close this popup (script.js). CONTEXT is the default page. -->
    <div class="menu-popup" id="menu-popup" aria-hidden="true" data-lenis-prevent>
        <nav class="menu-links" aria-label="Sections">
            <button class="link menu-link current" type="button" data-fade="link" aria-current="page">CONTEXT</button>
            <button class="link menu-link" type="button" data-fade="link">SAMPLES</button>
            <button class="link menu-link" type="button" data-fade="link">LISTEN</button>
        </nav>
    </div>

    <!-- Top-right button. Starts as the menu icon, becomes the X while the menu popup is open
         (script.js morphs the top + bottom bar paths and fades the middle bar).
         The white ring (svg-elem-2) never changes. -->
    <button class="page-close" id="page-close" type="button" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 67.733334 67.733333" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <defs>
                <filter id="close-aa" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
                    <feGaussianBlur stdDeviation="0.8" />
                </filter>
            </defs>
            <circle class="svg-elem-1" cx="33.866665" cy="33.866665" r="33.866665" />
            <g fill="none" stroke="#fff" stroke-width="4.23333" stroke-linecap="round" stroke-linejoin="round">
                <circle class="svg-elem-2" cx="33.866665" cy="33.866669" r="25.400002" />
                <!-- the three bars. "d" of top + bottom is rewritten by script.js. pathLength="1" keeps the draw-in dash
                     exactly one bar long whatever shape the bar is in (see svg.css) -->
                <path class="svg-elem-3" id="icon-top" pathLength="1" d="M 10.882,24.867 L 56.852,24.867" />
                <path class="svg-elem-4" id="icon-bottom" pathLength="1" d="M 10.882,42.867 L 56.852,42.867" />
                <path class="svg-elem-5" id="icon-mid" pathLength="1" d="M 8.467,33.867 L 59.267,33.867" />
            </g>
        </svg>
    </button>

    <!-- Lenis (pinned version). Site still works with native scrolling if this fails to load. -->
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="script.js"></script>
    <script>document.title = "\u2800";</script>
</body>

</html>
